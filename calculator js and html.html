<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <style>
        /* Minimalist CSS to make it look clean and centered */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 300px;
            width: 100%;
        }

        .length-control {
            margin-bottom: 15px;
        }

        input[type="number"] {
            width: 50px;
            padding: 5px;
            text-align: center;
        }
button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background-color: #218838;
        }

        #password-display {
            margin-top: 20px;
            padding: 15px;
            background-color: #e9ecef;
            border-radius: 5px;
            font-family: monospace;
            font-size: 18px;
            letter-spacing: 2px;
            word-wrap: break-word;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Password Generator</h2>
        
        <div class="length-control">
            <label for="pwd-length">Length: </label>
            <input type="number" id="pwd-length" value="12" min="1" max="50">
        </div>

        <button onclick="generateAndDisplay()">Generate</button>

        <div id="password-display">...</div>
    </div>

    <script>
        // Your exact working function
        function generatepassword(length) {
            const characters = "ASFDGYEYTDFERXVDTED34537643689/*/$%.........";
            let password = "";
            
            for (let i = 0; i < length; i++) {
                const randomIndex = Math.floor(Math.random() * characters.length);
                password += characters[randomIndex];
            }
            
            return password;
        }

        // New function to connect your code to the HTML buttons
        function generateAndDisplay() {
            // 1. Get the length typed into the input box
            const lengthInput = document.getElementById("pwd-length").value;
            
            // 2. Generate the password using your function
            const newPassword = generatepassword(lengthInput);
            
            // 3. Show the new password inside the display box
            document.getElementById("password-display").innerText = newPassword;
        }
    </script>

</body>
</html>
